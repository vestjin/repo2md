<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>repo2md — 项目转 Markdown</title>
  <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jstree@3.3.12/dist/themes/default/style.min.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="shell">

    <!-- ==================== 标题栏 ==================== -->
    <div class="titlebar">
      <div class="traffic">
        <span class="dot dot-r"></span>
        <span class="dot dot-y"></span>
        <span class="dot dot-g"></span>
      </div>
      <div class="titlebar-title"><span class="prompt">~/</span>repo2md</div>
      <div class="titlebar-meta">项目转 Markdown</div>
    </div>

    <div class="workspace">

      <!-- ==================== 左侧栏 ==================== -->
      <aside class="sidebar">

        <!-- 来源 -->
        <div class="section">
          <div class="section-label">来源</div>
          <div class="drop-zone" id="drop-zone">
            <div class="drop-ascii">[ + ]</div>
            <div class="drop-title">拖入文件夹或压缩包</div>
            <div class="drop-sub">ZIP · TAR · GZ · TGZ</div>

            <div class="pick-wrap">
              <button type="button" id="pick-btn" class="btn btn-accent"
                      aria-haspopup="true" aria-expanded="false">
                选择来源
                <span class="caret" aria-hidden="true"></span>
              </button>

              <div class="pick-menu" id="pick-menu" hidden role="menu">
                <button type="button" class="menu-item" id="menu-folder" role="menuitem">
                  <span class="menu-icon">📁</span>
                  <span class="menu-body">
                    <strong>选择文件夹</strong>
                    <small>直接读取本地目录</small>
                  </span>
                </button>
                <button type="button" class="menu-item" id="menu-archive" role="menuitem">
                  <span class="menu-icon">📦</span>
                  <span class="menu-body">
                    <strong>上传压缩包</strong>
                    <small>ZIP / TAR / GZ / TGZ</small>
                  </span>
                </button>
              </div>
            </div>
          </div>

          <input type="file" id="directory-picker" webkitdirectory directory multiple hidden />
          <input type="file" id="archive-upload" accept=".zip,.tar,.gz,.tgz,.tar.gz,.gzip" hidden />

          <div class="progress-stack">
            <div id="archive-progress" class="progress" hidden>
              <span class="spinner"></span>
              <span>解压中 · 已处理 <b id="extract-count">0</b> 个文件</span>
            </div>
            <div id="scan-progress" class="progress" hidden>
              <span class="spinner"></span>
              <span>扫描中 · 已发现 <b id="scan-count">0</b> 个文件</span>
            </div>
          </div>
        </div>

        <!-- 后缀筛选 -->
        <div class="section">
          <div class="section-label">后缀筛选</div>
          <div id="extension-filters" class="chips"></div>
        </div>

        <!-- 文件树 -->
        <div class="section section-grow">
          <div class="section-label">
            <span>文件列表</span>
            <span class="size-tag" id="size-display">0 B</span>
          </div>
          <div id="tree-container"></div>
        </div>

      </aside>

      <!-- ==================== 右侧编辑区 ==================== -->
      <main class="editor">

        <div class="editor-head">
          <div class="tab active">
            <span class="tab-dot"></span>
            output.md
          </div>
          <div class="editor-actions">
            <button id="generate-btn" class="btn btn-accent">▶ 生成</button>
            <button id="copy-btn" class="btn">复制</button>
            <button id="export-btn" class="btn">导出</button>
            <button id="share-btn" class="btn" hidden>分享</button>
          </div>
        </div>

        <div id="generate-progress" class="progress" hidden>
          <span class="spinner"></span>
          <span>生成中 · <b id="generate-status"></b></span>
        </div>

        <textarea id="markdown-output" placeholder="// 生成的 Markdown 会显示在这里…" spellcheck="false"></textarea>
      </main>

    </div>

    <!-- ==================== 状态栏 ==================== -->
    <footer class="statusbar">
      <span class="status-item"><span class="status-dot"></span>READY</span>
      <span class="status-spacer"></span>
      <span class="status-item">纯前端处理 · 文件不离开浏览器</span>
    </footer>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/pako@2.1.0/dist/pako.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jstree@3.3.12/dist/jstree.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
